<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="sbBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e2839"/>
      <stop offset="1" stop-color="#0a0f1a"/>
    </linearGradient>
    <filter id="sbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="#0f1623"/>
  <rect width="100" height="100" rx="22" fill="url(#sbBg)" opacity="0.5"/>
  <rect x="16" y="20" width="68" height="60" rx="5" fill="#182033" stroke="#2a3348" stroke-width="1"/>
  <!-- Top row -->
  <rect x="22" y="28" width="14" height="22" rx="2.5" fill="#2a3348" stroke="#3a4358" stroke-width="0.5"/>
  <rect x="25" y="31" width="8" height="8" rx="1" fill="rgba(255,255,255,0.12)"/>
  <rect x="44" y="28" width="14" height="22" rx="2.5" fill="#2a3348" stroke="#3a4358" stroke-width="0.5"/>
  <rect x="47" y="31" width="8" height="8" rx="1" fill="rgba(255,255,255,0.12)"/>
  <rect x="66" y="28" width="14" height="22" rx="2.5" fill="#2a3348" stroke="#3a4358" stroke-width="0.5"/>
  <rect x="69" y="39" width="8" height="8" rx="1" fill="rgba(255,255,255,0.12)"/>
  <!-- Bottom row -->
  <rect x="22" y="52" width="14" height="22" rx="2.5" fill="#2a3348" stroke="#3a4358" stroke-width="0.5"/>
  <rect x="25" y="55" width="8" height="8" rx="1" fill="rgba(255,255,255,0.12)"/>
  <!-- The glowing ON switch -->
  <rect x="44" y="52" width="14" height="22" rx="2.5" fill="#00BAD6" stroke="#00BAD6" stroke-width="0.5" filter="url(#sbGlow)"/>
  <rect x="47" y="55" width="8" height="8" rx="1" fill="rgba(255,255,255,0.6)"/>
  <rect x="66" y="52" width="14" height="22" rx="2.5" fill="#2a3348" stroke="#3a4358" stroke-width="0.5"/>
  <rect x="69" y="55" width="8" height="8" rx="1" fill="rgba(255,255,255,0.12)"/>
</svg>
